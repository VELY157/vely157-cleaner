<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>VELY157 · Acceso</title>
<style>
  :root { --bg:#0b0f14; --card:#121821; --line:#222c38; --text:#e6edf3; --muted:#8b949e; --accent:#22c55e; --bad:#f87171; }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; background:radial-gradient(circle at 50% 0%, #10261a, var(--bg) 60%); color:var(--text); font-family:"Segoe UI",system-ui,sans-serif; padding:16px; }
  form { width:100%; max-width:360px; background:var(--card); border:1px solid var(--line); border-radius:14px; padding:28px; }
  h1 { margin:0 0 4px; font-size:22px; letter-spacing:.5px; }
  h1 span { color:var(--accent); }
  p { margin:0 0 20px; color:var(--muted); font-size:14px; }
  label { display:block; font-size:13px; color:var(--muted); margin-bottom:6px; }
  input { width:100%; padding:11px 12px; border-radius:8px; border:1px solid var(--line); background:#0d131a; color:var(--text); font-size:15px; }
  input:focus { outline:2px solid var(--accent); outline-offset:1px; }
  button { margin-top:16px; width:100%; padding:11px; border:0; border-radius:8px; background:var(--accent); color:#05210f; font-weight:700; font-size:15px; cursor:pointer; }
  .err { display:none; margin-top:12px; color:var(--bad); font-size:14px; }
</style>
</head>
<body>
<form method="post" action="/admin/login">
  <h1>VELY<span>157</span> Licencias</h1>
  <p>Panel de administración</p>
  <label for="password">Contraseña</label>
  <input id="password" name="password" type="password" autocomplete="current-password" required autofocus>
  <button type="submit">Entrar</button>
  <div class="err" id="err">Contraseña incorrecta.</div>
</form>
<script>
  if (new URLSearchParams(location.search).has('e')) document.getElementById('err').style.display = 'block';
</script>
</body>
</html>
