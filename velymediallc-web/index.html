<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vely Media LLC</title>
<meta name="description" content="Vely Media LLC — Muy pronto.">
<style>
  :root { --bg:#07090d; --text:#e6edf3; --muted:#8b949e; --a:#22c55e; --b:#14b8a6; --c:#3b82f6; }
  * { box-sizing:border-box; }
  html, body { height:100%; }
  body {
    margin:0; overflow:hidden; background:var(--bg); color:var(--text);
    font-family:"Segoe UI",system-ui,-apple-system,sans-serif;
    display:grid; place-items:center; padding:16px;
  }

  /* Fondo: cuadrícula que se desplaza y luces que flotan */
  .grid {
    position:fixed; inset:-50%;
    background-image:linear-gradient(rgba(255,255,255,.035) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.035) 1px, transparent 1px);
    background-size:48px 48px;
    transform:perspective(600px) rotateX(55deg);
    animation:grid 18s linear infinite;
    mask-image:radial-gradient(circle at 50% 40%, #000 0%, transparent 60%);
  }
  @keyframes grid { to { background-position:0 480px; } }
  .orb { position:fixed; border-radius:50%; filter:blur(70px); opacity:.45; animation:float 14s ease-in-out infinite alternate; }
  .orb.one   { width:420px; height:420px; background:var(--a); top:-120px; left:-80px; }
  .orb.two   { width:360px; height:360px; background:var(--c); bottom:-140px; right:-60px; animation-delay:-5s; }
  .orb.three { width:260px; height:260px; background:var(--b); top:40%; left:55%; animation-delay:-9s; opacity:.3; }
  @keyframes float { to { transform:translate(60px,40px) scale(1.15); } }

  main { position:relative; text-align:center; max-width:720px; }
  .logo {
    font-size:clamp(40px, 10vw, 92px); font-weight:800; letter-spacing:-.02em; line-height:1; margin:0;
    background:linear-gradient(90deg, var(--text), var(--a), var(--b), var(--c), var(--text));
    background-size:300% 100%;
    -webkit-background-clip:text; background-clip:text; color:transparent;
    animation:shine 8s linear infinite, rise .9s cubic-bezier(.2,.8,.2,1) both;
  }
  @keyframes shine { to { background-position:300% 0; } }
  .llc { display:block; font-size:.32em; letter-spacing:.6em; margin-top:.35em; padding-left:.6em; font-weight:600; }
  @keyframes rise { from { opacity:0; transform:translateY(24px); filter:blur(8px); } }

  .soon {
    margin:34px auto 0; display:inline-flex; align-items:center; gap:12px;
    padding:12px 22px; border-radius:999px; border:1px solid rgba(255,255,255,.12);
    background:rgba(255,255,255,.04); backdrop-filter:blur(8px);
    font-size:clamp(16px, 3.6vw, 20px); letter-spacing:.18em; text-transform:uppercase;
    animation:rise .9s .35s cubic-bezier(.2,.8,.2,1) both;
  }
  .dot { width:10px; height:10px; border-radius:50%; background:var(--a); box-shadow:0 0 0 0 rgba(34,197,94,.7); animation:pulse 1.8s infinite; }
  @keyframes pulse { 70% { box-shadow:0 0 0 14px rgba(34,197,94,0); } 100% { box-shadow:0 0 0 0 rgba(34,197,94,0); } }

  .bar { width:min(280px, 70vw); height:3px; margin:30px auto 0; border-radius:3px; background:rgba(255,255,255,.08); overflow:hidden; animation:rise .9s .6s both; }
  .bar::after { content:""; display:block; width:40%; height:100%; background:linear-gradient(90deg, transparent, var(--a), transparent); animation:load 2.2s ease-in-out infinite; }
  @keyframes load { from { transform:translateX(-100%); } to { transform:translateX(250%); } }

  footer { position:fixed; bottom:18px; left:0; right:0; text-align:center; color:var(--muted); font-size:13px; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation:none !important; }
  }
</style>
</head>
<body>
  <div class="grid" aria-hidden="true"></div>
  <div class="orb one" aria-hidden="true"></div>
  <div class="orb two" aria-hidden="true"></div>
  <div class="orb three" aria-hidden="true"></div>

  <main>
    <h1 class="logo">Vely Media<span class="llc">LLC</span></h1>
    <div class="soon"><span class="dot"></span>Muy pronto</div>
    <div class="bar" aria-hidden="true"></div>
  </main>

  <footer>&copy; <span id="y"></span> Vely Media LLC</footer>
  <script>document.getElementById('y').textContent = new Date().getFullYear();</script>
</body>
</html>
